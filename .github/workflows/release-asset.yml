name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag matching manifest.json (for example v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  hassfest:
    uses: ./.github/workflows/validate-hassfest.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  hacs:
    uses: ./.github/workflows/validate-hacs.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: [tests, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate version and build release artifacts
        run: python scripts/build_release.py "$RELEASE_TAG" --output-dir dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.checkout.outputs.commit }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/thessla_green_*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
